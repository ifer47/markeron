name: Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cancel stale deploys so a stuck deployment_queued run cannot block the next one.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry_2.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # Pages fails transiently in two ways: the artifact API can lag behind the
      # upload ("Found 0 artifact(s)"), and the deployment API can return 5xx
      # while Pages is degraded (as during the 2026-11-25 incident). Both clear
      # on a short retry, so keep trying instead of leaving the site stale.
      - name: Back off before deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      # Also covers deployment_queued sitting out the full 10m poll window
      # (actions/deploy-pages#406).
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Back off before deploy retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Fail when every deploy attempt failed
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment_retry_1.outcome == 'failure' &&
          steps.deployment_retry_2.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deploy failed on every attempt."
          echo "Check https://www.githubstatus.com for a Pages incident, then re-run this workflow."
          exit 1
