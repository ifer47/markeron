name: Release

on:
  push:
    tags: ['v*']

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      body: ${{ steps.notes.outputs.result }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: notes
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            const { execSync } = require('child_process');
            const tag = context.ref.replace('refs/tags/', '');

            const headingMap = new Map([
              ["What's Changed", "What's New"],
              ["What's New", "What's New"],
              ["Features", "✨ New"],
              ["New Features", "✨ New"],
              ["New", "✨ New"],
              ["Exciting New Features", "✨ New"],
              ["Bug Fixes", "🛠 Fixes"],
              ["Fixes", "🛠 Fixes"],
              ["Improvements", "🧹 Improvements"],
              ["Updates", "🔄 Updates"],
              ["Security", "🔐 Security"],
              ["Documentation", "📚 Documentation"],
              ["CI", "👷 CI"],
            ]);

            function formatLine(subject) {
              const match = subject.match(/^(feat|fix|hotfix|docs|ui|refactor|perf|ci|build|chore|i18n|security)(?:\([^)]+\))?!?:\s*(.+)$/i);
              if (!match) return subject.trim();
              const [, type, desc] = match;
              const text = desc.charAt(0).toUpperCase() + desc.slice(1).replace(/\.$/, '');
              const prefixMap = {
                feat: 'Added',
                fix: 'Fixed',
                hotfix: 'Fixed',
                docs: 'Documented',
                ui: 'Updated UI:',
                refactor: 'Refactored',
                perf: 'Improved performance:',
                ci: 'Updated CI:',
                build: 'Updated build:',
                chore: 'Updated',
                i18n: 'Updated i18n:',
                security: 'Fixed security:',
              };
              const prefix = prefixMap[type.toLowerCase()] || 'Updated';
              if (prefix.endsWith(':')) return `${prefix} ${text}.`;
              return `${prefix} ${text.charAt(0).toLowerCase() + text.slice(1)}.`;
            }

            function buildFromGitLog() {
              let prevTag = '';
              try {
                prevTag = execSync(`git describe --tags --abbrev=0 ${tag}^`, { encoding: 'utf8' }).trim();
              } catch {
                return '';
              }

              const subjects = execSync(`git log ${prevTag}..${tag} --pretty=format:%s`, { encoding: 'utf8' })
                .split('\n')
                .map((s) => s.trim())
                .filter(Boolean);

              const buckets = new Map([
                ['✨ New', []],
                ['🛠 Fixes', []],
                ['🧹 Improvements', []],
                ['📚 Documentation', []],
                ['👷 CI', []],
              ]);

              for (const subject of subjects) {
                if (/^chore\(release\):/i.test(subject)) continue;
                const lower = subject.toLowerCase();
                let bucket = '🧹 Improvements';
                if (lower.startsWith('feat')) bucket = '✨ New';
                else if (lower.startsWith('fix') || lower.startsWith('hotfix')) bucket = '🛠 Fixes';
                else if (lower.startsWith('docs')) bucket = '📚 Documentation';
                else if (lower.startsWith('ci') || lower.startsWith('build')) bucket = '👷 CI';
                buckets.get(bucket).push(formatLine(subject));
              }

              let body = `## What's New in ${tag}\n\n`;
              for (const [title, items] of buckets) {
                if (!items.length) continue;
                body += `### ${title}\n`;
                for (const item of items) body += `- ${item}\n`;
                body += '\n';
              }
              body += `**Full Changelog**: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${prevTag}...${tag}\n`;
              return body;
            }

            let body = '';
            try {
              const { data } = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                configuration_file_path: '.github/release.yml',
              });
              body = data.body || '';
              if (body.includes('###')) {
                body = body.replace(/^###\s+(.*)$/gm, (_, heading) => {
                  const nextHeading = headingMap.get(heading.trim()) ?? heading.trim();
                  return `### ${nextHeading}`;
                });
                if (!body.startsWith('## What')) {
                  body = `## What's New in ${tag}\n\n${body}`;
                }
              }
            } catch (error) {
              core.info(`generateReleaseNotes failed: ${error.message}`);
            }

            if (!body.includes('###')) {
              body = buildFromGitLog();
            }

            if (!body.trim()) {
              body = `## What's New in ${tag}\n\nSee the assets below to download and install.\n`;
            }

            return body;

  # Windows stays parallel with macOS. Both macOS targets share one runner so we only
  # need a single macos-latest (arm64) allocation — GitHub has been cancelling the
  # second concurrent macOS job after ~15m with "not acquired by Runner".
  build-windows:
    needs: release-notes
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Import and verify code-signing certificate (Windows)
        id: codesign
        shell: powershell
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          ALLOW_UNSIGNED_WINDOWS_RELEASE: ${{ vars.ALLOW_UNSIGNED_WINDOWS_RELEASE }}
        run: |
          # GitHub reads step outputs as UTF-8; Windows PowerShell's Out-File defaults
          # to UTF-16, which silently drops the output and turns signing off.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          if (-not $env:SIGN_PFX_BASE64) {
            if ($env:ALLOW_UNSIGNED_WINDOWS_RELEASE -eq "true") {
              Write-Host "::warning::No signing certificate - releasing UNSIGNED Windows build (ALLOW_UNSIGNED_WINDOWS_RELEASE=true)."
              [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sign_args=`n", $utf8NoBom)
              exit 0
            }
            Write-Error "SIGN_PFX_BASE64 is not configured. Unsigned Windows builds make the in-app updater look stuck (Defender holds the downloaded installer before it starts) and trigger SmartScreen warnings. Add SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD, or set the repository variable ALLOW_UNSIGNED_WINDOWS_RELEASE=true to release unsigned deliberately."
            exit 1
          }

          $pfxBytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          if (-not $env:SIGN_PFX_PASSWORD) {
            Write-Error "SIGN_PFX_PASSWORD is not configured."
            exit 1
          }
          $securePass = ConvertTo-SecureString -String $env:SIGN_PFX_PASSWORD -Force -AsPlainText
          $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePass)
          Remove-Item $pfxPath

          $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $cert) {
            Write-Error "The PFX has no certificate with a private key."
            exit 1
          }

          $expected = (Get-Content src-tauri/tauri.sign.conf.json -Raw | ConvertFrom-Json).bundle.windows.certificateThumbprint
          if ($cert.Thumbprint -ne $expected) {
            Write-Error "Imported certificate thumbprint $($cert.Thumbprint) does not match src-tauri/tauri.sign.conf.json ($expected). Fix the thumbprint or upload the matching PFX."
            exit 1
          }

          Write-Host "Signing with $($cert.Subject) ($($cert.Thumbprint))"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "sign_args=-c src-tauri/tauri.sign.conf.json`n", $utf8NoBom)

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkerOn ${{ github.ref_name }}'
          releaseBody: ${{ needs.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
          args: ${{ steps.codesign.outputs.sign_args }}

      - name: Verify Windows code signatures
        if: vars.ALLOW_UNSIGNED_WINDOWS_RELEASE != 'true'
        shell: powershell
        run: |
          # tauri-bundler signs the main binary, packs it into each installer, then
          # restores the original unsigned exe on disk. Verify what users download.
          $targets = @()
          $targets += @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $targets += @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })

          if ($targets.Count -eq 0) {
            Write-Host "::error::No bundled Windows installers found to verify"
            exit 1
          }

          $unsigned = @()
          foreach ($target in $targets) {
            $sig = Get-AuthenticodeSignature -FilePath $target
            if (-not $sig.SignerCertificate) {
              Write-Host "::error::$([IO.Path]::GetFileName($target)) is not code-signed"
              $unsigned += $target
            } else {
              Write-Host "$([IO.Path]::GetFileName($target)): $($sig.SignerCertificate.Subject) [$($sig.Status)]"
            }
          }

          if ($unsigned.Count -gt 0) {
            throw "Release aborted: a Windows installer is unsigned. Unsigned installers make the in-app updater sit silently while Defender scans them, and SmartScreen flags the download."
          }

      - name: Stash updater fragment
        shell: bash
        run: |
          if [ -f latest.json ]; then
            cp latest.json updater-windows.json
          else
            echo "Updater fragment not found after build (expected ./latest.json)"
            find . -name 'latest.json' 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: updater-windows
          path: updater-windows.json
          if-no-files-found: error

      - name: Build MSIX
        shell: bash
        run: bash scripts/build-msix.sh

      - name: Upload MSIX to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSIX=$(ls src-tauri/target/release/bundle/msix/*.msix)
          gh release upload "${{ github.ref_name }}" "$MSIX" --clobber

      - name: Build portable zip
        shell: bash
        run: bash scripts/build-portable.sh

      - name: Upload portable zip to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP=$(ls src-tauri/target/release/bundle/portable/*_portable.zip)
          gh release upload "${{ github.ref_name }}" "$ZIP" --clobber

  build-macos:
    needs: release-notes
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - name: Configure macOS ad-hoc signing
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build and release (aarch64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkerOn ${{ github.ref_name }}'
          releaseBody: ${{ needs.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      - name: Stash updater fragment (aarch64)
        run: |
          if [ -f latest.json ]; then
            cp latest.json updater-macos-aarch64.json
          else
            echo "Updater fragment not found after aarch64 build (expected ./latest.json)"
            find . -name 'latest.json' 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: updater-macos-aarch64
          path: updater-macos-aarch64.json
          if-no-files-found: error

      - name: Build and release (x86_64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MarkerOn ${{ github.ref_name }}'
          releaseBody: ${{ needs.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
          args: --target x86_64-apple-darwin

      - name: Stash updater fragment (x86_64)
        run: |
          if [ -f latest.json ]; then
            cp latest.json updater-macos-x64.json
          else
            echo "Updater fragment not found after x86_64 build (expected ./latest.json)"
            find . -name 'latest.json' 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: updater-macos-x64
          path: updater-macos-x64.json
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: actions/download-artifact@v7
        with:
          pattern: updater-*
          path: updater-fragments
          merge-multiple: true

      - name: Merge updater JSON
        run: node scripts/merge-updater-json.mjs updater-fragments merged-latest.json

      - name: Consolidate release assets and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/consolidate-github-release.mjs "${{ github.ref_name }}" merged-latest.json
