name: Sync contributors

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-contributors
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync GitHub contributors
        run: node scripts/sync-contributors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated sponsors
        run: |
          if [ -z "$(git status --porcelain -- src/data/sponsors.json)" ]; then
            echo "No sponsor changes"
            exit 0
          fi
          git checkout -B master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sponsors.json
          git commit -m "chore(contributors): sync GitHub contributors"
          git pull --rebase origin master
          git push origin HEAD:master
