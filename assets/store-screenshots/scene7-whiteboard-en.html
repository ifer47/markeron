<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>MarkerOn - Whiteboard Mode</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html {
  overflow: hidden; height: 100vh;
  background:
    radial-gradient(ellipse 80% 60% at 30% 70%, rgba(20, 60, 120, 0.7) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 70% 40%, rgba(40, 80, 160, 0.5) 0%, transparent 60%),
    radial-gradient(ellipse 90% 80% at 50% 50%, rgba(10, 30, 80, 0.8) 0%, transparent 80%),
    linear-gradient(135deg, #0a0e1a 0%, #0d1528 30%, #111d3a 60%, #0a1020 100%);
}
body {
  width: 1920px;
  height: 1080px;
  /* overflow: hidden; */
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  background: transparent;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 100px 40px;
}
.desktop-bg {
  display: none;
}

.header {
  text-align: center;
  margin-bottom: 50px;
}
.header .accent-line {
  width: 40px;
  height: 4px;
  background: #FF3B30;
  border-radius: 2px;
  margin: 0 auto 20px;
}
.header h1 {
  font-size: 44px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 2px;
  margin-bottom: 14px;
}
.header .subtitle {
  font-size: 16px;
  color: rgba(255,255,255,0.45);
}
.header .subtitle kbd {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 13px;
  font-family: inherit;
  color: rgba(255,255,255,0.6);
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 20px;
  width: 1680px;
  height: 680px;
  margin: 20px auto 0;
}

.tool-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 24px 28px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.tool-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.tool-card-header h3 {
  font-size: 17px;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
}
.tool-key {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  font-weight: 500;
}
.tool-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  margin-bottom: 18px;
}
.tool-desc kbd {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 3px;
  padding: 0 4px;
  font-family: inherit;
  font-size: 11px;
  color: rgba(255,255,255,0.55);
}
.tool-demo {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 140px;
}
.tool-demo svg {
  width: 100%;
  height: 100%;
  max-height: 160px;
}

/* Windows 11 Taskbar */
.taskbar {
  position: absolute;
  bottom: calc(-1 * var(--oy, 0px));
  left: calc(-1 * var(--ox, 0px));
  right: calc(-1 * var(--ox, 0px));
  height: 48px;
  background: rgba(32, 32, 32, 0.85);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  z-index: 1;
}
.taskbar-icon {
  width: 40px;
  height: 40px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.9);
  position: relative;
}
.taskbar-icon.active { background: rgba(255,255,255,0.08); }
.taskbar-icon.active::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 16px;
  height: 3px;
  border-radius: 2px;
  background: #60cdff;
}
.taskbar-time {
  position: absolute;
  right: 16px;
  color: rgba(255,255,255,0.9);
  font-size: 12px;
  text-align: right;
  line-height: 1.4;
}

/* MarkerOn branding */
.markeron-brand {
  position: absolute;
  bottom: calc(70px - var(--oy, 0px));
  right: calc(40px - var(--ox, 0px));
  display: flex;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.25);
  font-size: 13px;
  z-index: 100;
}
.markeron-brand svg { width: 16px; height: 16px; }

/* Whiteboard comparison */
.board-row {
  display: flex;
  align-items: flex-start;
  gap: 48px;
  margin-top: 96px;
}
.board-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.board {
  position: relative;
  width: 760px;
  height: 500px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.3);
}
.board--white { background: #FBFAF7; border: 1px solid rgba(0,0,0,0.08); }
.board--black { background: #0E0E10; border: 1px solid rgba(255,255,255,0.1); }
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.board-caption {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
}
.board-caption .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.board-caption .dot--white { background: #FBFAF7; }
.board-caption .dot--black { background: #0E0E10; border: 1px solid rgba(255,255,255,0.35); }
</style>
</head>
<body>

<div class="desktop-bg"></div>

<div class="header">
  <div class="accent-line"></div>
  <h1>Whiteboard mode, ready when you are</h1>
  <div class="subtitle">Press <kbd>W</kbd> to toggle; white or black canvas, content survives sessions, <kbd>Ctrl</kbd>+<kbd>C</kbd> copies it as an image</div>
</div>

<div class="board-row">
  <div class="board-col">
      <!-- White board (EN) -->
      <div class="board board--white">
        <svg viewBox="0 0 760 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="56" y="88" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#1F2937">Q4 growth breakdown</text>
          <line x1="56" y1="106" x2="330" y2="106" stroke="#FF3B30" stroke-width="3" stroke-linecap="round"/>

          <text x="56" y="168" font-family="-apple-system, sans-serif" font-size="18" fill="#374151">1 - Acquisition cost is down</text>
          <text x="56" y="216" font-family="-apple-system, sans-serif" font-size="18" fill="#374151">2 - Renewal rate back to 92%</text>
          <text x="56" y="264" font-family="-apple-system, sans-serif" font-size="18" fill="#374151">3 - ARPU up 12%</text>

          <rect x="40" y="286" width="300" height="34" rx="4" fill="rgba(255,204,2,0.42)"/>

          <ellipse cx="196" cy="239" rx="178" ry="46" transform="rotate(-4, 196, 239)"
            stroke="#FF3B30" stroke-width="3.2" stroke-dasharray="13 9.75" stroke-linecap="round"/>

          <path d="M470,300 C520,250 580,330 640,270" stroke="#007AFF" stroke-width="3.4" stroke-linecap="round"/>
          <polygon points="662,262 636,258 646,278" fill="#007AFF"/>
          <text x="480" y="352" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#007AFF">Next quarter focus</text>

          <circle cx="648" cy="150" r="24" fill="#34C759"/>
          <circle cx="648" cy="150" r="24" fill="none" stroke="#FFFFFF" stroke-width="3"/>
          <text x="648" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">1</text>

          <line x1="56" y1="400" x2="700" y2="400" stroke="#1F2937" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 8"/>
        </svg>
      </div>
      <div class="board-caption"><span class="dot dot--white"></span>White board</div>
  </div>
  <div class="board-col">
      <div class="board board--black">
        <svg viewBox="0 0 760 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="56" y="88" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#F3F4F6">Q4 growth breakdown</text>
          <line x1="56" y1="106" x2="330" y2="106" stroke="#FF453A" stroke-width="3" stroke-linecap="round"/>

          <text x="56" y="168" font-family="-apple-system, sans-serif" font-size="18" fill="#D1D5DB">1 - Acquisition cost is down</text>
          <text x="56" y="216" font-family="-apple-system, sans-serif" font-size="18" fill="#D1D5DB">2 - Renewal rate back to 92%</text>
          <text x="56" y="264" font-family="-apple-system, sans-serif" font-size="18" fill="#D1D5DB">3 - ARPU up 12%</text>

          <rect x="40" y="286" width="300" height="34" rx="4" fill="rgba(255,204,2,0.3)"/>

          <ellipse cx="196" cy="239" rx="178" ry="46" transform="rotate(-4, 196, 239)"
            stroke="#FF453A" stroke-width="3.2" stroke-dasharray="13 9.75" stroke-linecap="round"/>

          <path d="M470,300 C520,250 580,330 640,270" stroke="#0A84FF" stroke-width="3.4" stroke-linecap="round"/>
          <polygon points="662,262 636,258 646,278" fill="#0A84FF"/>
          <text x="480" y="352" font-family="-apple-system, sans-serif" font-size="19" font-weight="700" fill="#0A84FF">Next quarter focus</text>

          <circle cx="648" cy="150" r="24" fill="#30D158"/>
          <circle cx="648" cy="150" r="24" fill="none" stroke="#0E0E10" stroke-width="3"/>
          <text x="648" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0E0E10">1</text>

          <line x1="56" y1="400" x2="700" y2="400" stroke="#F3F4F6" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.1 8"/>
        </svg>
      </div>
      <div class="board-caption"><span class="dot dot--black"></span>Black board</div>
  </div>
</div>

<!-- Taskbar -->
<div class="taskbar">
  <div class="taskbar-icon">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><rect x="1" y="1" width="8" height="8" rx="1"/><rect x="11" y="1" width="8" height="8" rx="1"/><rect x="1" y="11" width="8" height="8" rx="1"/><rect x="11" y="11" width="8" height="8" rx="1"/></svg>
  </div>
  <div class="taskbar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
  <div class="taskbar-icon active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></div>
  <div class="taskbar-icon active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><ellipse cx="12" cy="12" rx="5" ry="10"/></svg></div>
  <div class="taskbar-time">
    <div>15:42</div>
    <div style="font-size:11px;">2026/4/10</div>
  </div>
</div>

<!-- MarkerOn Branding -->
<div class="markeron-brand">
  <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M659.498667 412.8l-6.101334-6.058667a233.6 233.6 0 0 0-101.973333-57.557333c-124.032-33.237333-243.157333 37.077333-276.992 163.413333-1.834667 6.826667-2.816 14.506667-4.437333 33.749334-6.570667 79.786667-25.344 139.306667-76.8 199.68 96.426667 37.888 210.688 64.597333 297.557333 64.597333a234.88 234.88 0 0 0 226.56-174.037333 234.538667 234.538667 0 0 0-57.856-223.786667z m-92.501334-147.712l210.730667-163.925333a42.666667 42.666667 0 0 1 56.32 3.541333l127.786667 127.744a42.666667 42.666667 0 0 1 3.498666 56.32l-163.84 210.730667a320.213333 320.213333 0 0 1-310.741333 396.458666C341.333333 895.957333 149.333333 831.872 42.666667 767.872c169.813333-128 130.005333-205.226667 149.333333-277.333333 45.141333-168.533333 206.592-267.008 374.997333-225.450667zM712.533333 345.258667c2.816 2.688 5.546667 5.461333 8.277334 8.234666L769.28 401.92l105.6-135.765333-74.496-74.496-135.765333 105.6L712.533333 345.258667z"/></svg>
  MarkerOn
</div>

<script>
(function fitToScreen() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  var ox = (window.innerWidth - 1920 * s) / 2;
  var oy = (window.innerHeight - 1080 * s) / 2;
  document.body.style.transformOrigin = 'top left';
  document.body.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
  document.documentElement.style.setProperty('--ox', (ox / s) + 'px');
  document.documentElement.style.setProperty('--oy', (oy / s) + 'px');
  window.addEventListener('resize', fitToScreen);
})();
</script>
</body>
</html>
